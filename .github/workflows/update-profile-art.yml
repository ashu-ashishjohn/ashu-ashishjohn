name: Refresh profile contribution graph

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile_art.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fetch actual contributions and render SVG
        run: python profile_art.py
      - name: Commit refreshed graph when it changes
        run: |
          git add contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo 'Contribution graph is current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public contribution graph [skip ci]'
          git push
